<title>박한선 대표 | 대명유리</title>

<style>
:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --ink:#161616; --muted:#5A5A55; --line:#DCDCD6;
  --accent:#2446C8; --accent-ink:#FFFFFF; --accent-soft:#E6EBFA;
  box-sizing:border-box; color-scheme:only light;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{background:#FFFFFF !important;color:#161616 !important}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;line-height:1.5}
.wrap{max-width:440px;margin:0 auto;padding:20px 22px 40px}
a{color:inherit;text-decoration:none}
a:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}

.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:15px;letter-spacing:-0.01em}
.brand svg{flex:none}
.brand small{font-weight:500;font-size:12px;color:var(--muted);margin-left:auto;letter-spacing:0}

/* hero: photo in an offset frame */
.hero{position:relative;margin:28px 18px 0 0}
.hero::before{content:"";position:absolute;inset:18px -18px -18px 18px;border:1.5px solid var(--accent)}
.hero .glass{position:absolute;right:-18px;bottom:-18px;width:42%;height:34%;background:var(--accent);opacity:.9}
.hero img{position:relative;display:block;width:100%;height:auto;aspect-ratio:5/6;object-fit:cover;background:#fff}

.who{position:relative;z-index:2;margin-top:44px}
.who h1{position:relative;z-index:2;color:#111111 !important;margin:0;font-size:34px;font-weight:800;letter-spacing:0.02em;line-height:1.15}
.who h1 span{font-size:15px;font-weight:500;color:var(--muted);margin-left:8px;letter-spacing:0}
.who p{margin:6px 0 0;font-size:15px;color:var(--muted)}
.who p b{color:var(--ink);font-weight:700}

.actions{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:26px}
.act{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  min-height:72px;border-radius:14px;background:var(--surface);border:1px solid var(--line);
  font-size:13px;font-weight:500}
.act svg{width:22px;height:22px;stroke:var(--accent)}
.act.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.act.primary svg{stroke:var(--accent-ink)}
.act:active{transform:scale(.97)}

.info{margin-top:28px;border-top:2px solid var(--ink)}
.row{display:flex;align-items:center;gap:14px;padding:14px 2px;border-bottom:1px solid var(--line);min-height:56px}
.row .k{width:64px;flex:none;font-size:13px;color:var(--muted)}
.row .v{font-size:16px;font-weight:500;font-variant-numeric:tabular-nums;word-break:break-all}
.row .go{margin-left:auto;flex:none;width:20px;height:20px;stroke:var(--muted)}

.map{margin-top:22px;display:block;border-radius:16px;overflow:hidden;background:var(--surface);border:1px solid var(--line)}
.map .grid{height:120px;position:relative;background:
  linear-gradient(var(--line) 1px,transparent 1px) 0 0/24px 24px,
  linear-gradient(90deg,var(--line) 1px,transparent 1px) 0 0/24px 24px,var(--accent-soft)}
.map .grid .road{position:absolute;left:-10%;right:-10%;top:58%;height:10px;background:var(--surface);transform:rotate(-8deg)}
.map .grid .road2{position:absolute;top:-10%;bottom:-10%;left:38%;width:8px;background:var(--surface);transform:rotate(12deg)}
.map .grid .pin{position:absolute;left:50%;top:44%;transform:translate(-50%,-100%)}
.map .body{display:flex;align-items:center;gap:12px;padding:16px 18px}
.map .body div{flex:1;min-width:0}
.map .body strong{display:block;font-size:16px}
.map .body span{font-size:13px;color:var(--muted)}
.map .btn{flex:none;background:#03C75A;color:#fff;font-weight:700;font-size:14px;border-radius:10px;padding:10px 14px;white-space:nowrap}

.save{margin-top:14px;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;border-radius:14px;border:1.5px solid var(--ink);background:transparent;color:var(--ink);font:inherit;font-size:15px;font-weight:700;cursor:pointer}
.save svg{width:20px;height:20px;stroke:currentColor}
footer{margin-top:36px;display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px}
footer svg{flex:none}
</style>
</head>
